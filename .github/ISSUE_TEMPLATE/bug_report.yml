name: Bug report
description: Report a reproducible NSDeck problem without exposing DNS or account data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use **Security → Report a vulnerability**.
        Never include credentials, real domains, internal server names, raw logs, settings, snapshots, or JEA transcripts.

  - type: input
    id: version
    attributes:
      label: NSDeck version
      placeholder: 0.6.0
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Namecheap
        - Azure DNS
        - GoDaddy
        - Cloudflare
        - AWS Route 53
        - Google Cloud DNS
        - Windows DNS
        - Multiple providers / Change Lab
        - Application UI or packaging
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use reserved examples such as example.com and 192.0.2.10.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Shareable diagnostic report details
      description: Attach only the ZIP generated by Export Shareable Diagnostic Report, or paste its sanitized summary.

  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, personal data, production DNS data, and internal infrastructure names.
          required: true
        - label: I searched existing issues for this problem.
          required: true
